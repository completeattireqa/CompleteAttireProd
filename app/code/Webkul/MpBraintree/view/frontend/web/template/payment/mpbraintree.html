<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
            <fieldset class="fieldset" data-bind='attr: {id: "payment_form_" + getCode()}'>
            <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
            </div>
            <div class="mpbraintree-dropin-ui">
                <input type="hidden" data-bind="value: paymentNonce()" name="payment_method_nonce" />
                <div id="mpbraintree-container">
                </div>
            <input type="checkbox" class="checkbox canSaveCard" data-bind="click: updateValutStatus(), value:storeInVaultOnSuccess(), visible: canSaveCard()" name="storeInVaultOnSuccess">
            <label class="label">
                <span data-bind="i18n: 'securely save card for future payments', visible: canSaveCard()"></span>
            </label>
            </div>
            </fieldset>
      
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout mpbraintree"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: orderPlaceButtonTitle()},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        visible: displayPlaceOrder(),
                        enable: (getCode() == isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: orderPlaceButtonTitle()"></span>
                </button>

                <button class="action primary checkout mpbraintree-authorize"
                        type="button"
                        data-bind="
                        attr: {title: authorizeButtonTitle()},
                        enable: ((getCode() == isChecked()) && paymentMethodRequestable()),
                        visible: !displayPlaceOrder() && showAuthorize()
                        "
                        disabled>
                    <span data-bind="i18n: authorizeButtonTitle()"></span>
                </button>
            </div>
        </div>
    </div>
</div>
